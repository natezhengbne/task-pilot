services:
  dagu:
    image: ${DAGU_IMAGE:-ghcr.io/dagucloud/dagu:latest}
    container_name: ${DAGU_CONTAINER_NAME:-taskpilot-dagu}
    network_mode: host
    restart: unless-stopped
    volumes:
      - taskpilot_dagu_home:/var/lib/dagu
      - ../workflows/dagu:/var/lib/dagu/dags
    environment:
      - DAGU_HOST=${DAGU_HOST:-0.0.0.0}
      - DAGU_PORT=${DAGU_PORT:-5678}
      - DAGU_DAGS_DIR=/var/lib/dagu/dags
      - DAGU_DATA_DIR=/var/lib/dagu/data
      - DAGU_TZ=${DAGU_TZ:-UTC}
      - TASKPILOT_API_URL=${TASKPILOT_API_URL:-http://127.0.0.1:3456}
      - TASKPILOT_API_TOKEN=${TASKPILOT_API_TOKEN:-}
    command: ["dagu", "start-all"]

volumes:
  taskpilot_dagu_home:
    name: taskpilot_dagu_home
